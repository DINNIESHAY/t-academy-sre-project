name: travel-fellows

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:17.10
    logging: *default-logging
    restart: always
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${EXTERNAL_DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    image: ${APP_IMAGE:-ghcr.io/dinnieshay/t-academy-sre-project}:${APP_VERSION:-dev}
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      - SPRING_PROFILES_ACTIVE=migrate
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432

  redis:
    image: redis:7.4.11-alpine
    logging: *default-logging
    restart: always
    ports:
      - "127.0.0.1:${EXTERNAL_REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes

  seaweedfs:
    image: chrislusf/seaweedfs:4.47
    logging: *default-logging
    restart: always
    command: mini
    environment:
      - AWS_ACCESS_KEY_ID=${S3_ACCESS_KEY}
      - AWS_SECRET_ACCESS_KEY=${S3_SECRET_KEY}
    ports:
      - "127.0.0.1:${EXTERNAL_S3_PORT:-8333}:8333"
    volumes:
      - seaweedfs_data:/data
    healthcheck:
      test: [ "CMD", "curl", "-fs", "http://127.0.0.1:8333/healthz" ]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: ${APP_IMAGE:-ghcr.io/dinnieshay/t-academy-sre-project}:${APP_VERSION:-dev}
    logging: *default-logging
    restart: always
    deploy:
      replicas: ${APP_REPLICAS:-1}
    stop_grace_period: 30s
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://127.0.0.1:8081/actuator/health/readiness" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    env_file: .env
    environment:
      - SERVER_PORT=8080
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - S3_ENDPOINT=http://seaweedfs:8333

  proxy:
    image: ${APP_IMAGE:-ghcr.io/dinnieshay/t-academy-sre-project}-proxy:${APP_VERSION:-dev}
    logging: *default-logging
    restart: always
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      app:
        condition: service_healthy

  loki:
    image: grafana/loki:3.7.8
    logging: *default-logging
    profiles: [ logging ]
    restart: always
    volumes:
      - loki_data:/loki

  alloy:
    image: grafana/alloy:v1.20.1
    logging: *default-logging
    profiles: [ logging ]
    restart: always
    volumes:
      - ./logging/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:13.2.3
    logging: *default-logging
    profiles: [ logging ]
    restart: always
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    ports:
      - "127.0.0.1:${EXTERNAL_GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./logging/grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - loki

volumes:
  postgres_data:
  seaweedfs_data:
  redis_data:
  loki_data:
  grafana_data:
