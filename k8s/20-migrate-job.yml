---
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  namespace: travel-fellows
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: migrate
        image: travel-fellows-app:1.0.0
        imagePullPolicy: Never
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: migrate
        envFrom:
        - configMapRef:
            name: app-config
        - secretRef:
            name: app-secrets
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 512Mi
...
