---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: victoria-logs-data
  namespace: travel-fellows
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: victoria-logs
  namespace: travel-fellows
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: victoria-logs
  template:
    metadata:
      labels:
        app: victoria-logs
    spec:
      containers:
      - name: victoria-logs
        image: victoriametrics/victoria-logs:v1.53.0
        args: ["-storageDataPath=/storage"]
        ports:
        - containerPort: 9428
        readinessProbe:
          httpGet:
            path: /health
            port: 9428
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 9428
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 512Mi
        volumeMounts:
        - name: data
          mountPath: /storage
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: victoria-logs-data
---
apiVersion: v1
kind: Service
metadata:
  name: victoria-logs
  namespace: travel-fellows
spec:
  ports:
  - port: 9428
    targetPort: 9428
  selector:
    app: victoria-logs
...
