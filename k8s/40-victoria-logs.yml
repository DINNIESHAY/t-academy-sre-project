---
apiVersion: v1
kind: Service
metadata:
  name: victoria-logs
  namespace: travel-fellows
spec:
  clusterIP: None
  ports:
  - port: 9428
    targetPort: 9428
  selector:
    app: victoria-logs
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: victoria-logs
  namespace: travel-fellows
spec:
  serviceName: victoria-logs
  replicas: 1
  selector:
    matchLabels:
      app: victoria-logs
  template:
    metadata:
      labels:
        app: victoria-logs
    spec:
      containers:
      - name: victoria-logs
        image: victoriametrics/victoria-logs:v1.53.0
        args: ["-storageDataPath=/storage"]
        ports:
        - containerPort: 9428
        readinessProbe:
          httpGet:
            path: /health
            port: 9428
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 9428
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 512Mi
        volumeMounts:
        - name: data
          mountPath: /storage
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 1Gi
...
