---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: travel-fellows
data:
  SERVER_PORT: "8080"

  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: travel_fellows

  REDIS_HOST: redis
  REDIS_PORT: "6379"

  S3_ENDPOINT: http://seaweedfs:8333
  S3_REGION: us-east-1
  S3_BUCKET: travel-fellows
  S3_PATH_STYLE_ACCESS: "true"

  MAIL_FROM: TravelFellows <onboarding@resend.dev>

  CACHE_TTL: 10m
  SESSION_TIMEOUT: 30m
  SHUTDOWN_TIMEOUT: 20s
  LOG_LEVEL: INFO
  APP_LOG_LEVEL: INFO
...
