spring.application.name=travel-fellows-site
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/travel-fellows
server.forward-headers-strategy=framework
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=${SHUTDOWN_TIMEOUT:20s}

# Logging
logging.level.root=${LOG_LEVEL:INFO}
logging.level.ru.itis=${APP_LOG_LEVEL:INFO}
spring.main.banner-mode=off
logging.structured.format.console=ecs
logging.structured.ecs.service.version=${APP_VERSION:unknown}
logging.structured.ecs.service.environment=${APP_ENV:local}
logging.structured.ecs.service.node-name=${HOSTNAME:local}
logging.structured.json.customizer=ru.itis.config.SensitiveDataMasker

# Health checks
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

spring.web.error.include-message=always

spring.jackson.locale=ru_RU

# DB
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_SHOW_SQL:false}

# Liquibase
spring.liquibase.enabled=false
spring.liquibase.change-log=migrations/master.xml

# Resend API properties
app.resend.api-key=${RESEND_API_KEY}
app.resend.api-url=${RESEND_API_URL:https://api.resend.com/emails}
app.resend.from=${MAIL_FROM:TravelFellows <onboarding@resend.dev>}

# S3 storage
app.storage.s3.endpoint=${S3_ENDPOINT:}
app.storage.s3.region=${S3_REGION:us-east-1}
app.storage.s3.bucket=${S3_BUCKET:travel-fellows}
app.storage.s3.access-key=${S3_ACCESS_KEY}
app.storage.s3.secret-key=${S3_SECRET_KEY}
app.storage.s3.path-style-access=${S3_PATH_STYLE_ACCESS:true}

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2000ms

# Session
spring.session.timeout=${SESSION_TIMEOUT:30m}
spring.session.data.redis.namespace=travel-fellows:session

# Cache Configuration
spring.cache.type=redis
spring.cache.redis.time-to-live=${CACHE_TTL:10m}
spring.cache.redis.cache-null-values=false
spring.cache.redis.key-prefix=travel-fellows::
spring.cache.redis.use-key-prefix=true

# OpenAPI/Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
