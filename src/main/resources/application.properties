spring.application.name=travel-fellows-site
server.servlet.context-path=/travel-fellows

spring.web.error.include-message=always
spring.web.resources.static-locations=classpath:/static/,file:/app/uploads/

spring.jackson.locale=ru_RU

# DB
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Liquibase
spring.liquibase.enabled=false
spring.liquibase.change-log=migrations/master.xml

# Resend API properties
app.resend.api-key=${RESEND_API_KEY}
app.resend.api-url=https://api.resend.com/emails

# Path for saving images
app.upload.path=/app/uploads/

# Redis Configuration
spring.data.redis.host=redis
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms

# Cache Configuration
spring.cache.type=redis
spring.cache.redis.time-to-live=600000
spring.cache.redis.cache-null-values=false
spring.cache.redis.key-prefix=travel-fellows::
spring.cache.redis.use-key-prefix=true

# OpenAPI/Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
