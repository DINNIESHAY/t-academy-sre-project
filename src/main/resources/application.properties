spring.application.name=travel-fellows-site
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/travel-fellows

spring.web.error.include-message=always
spring.web.resources.static-locations=classpath:/static/,file:${UPLOAD_PATH:/app/uploads/}

spring.jackson.locale=ru_RU

# DB
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_SHOW_SQL:false}

# Liquibase
spring.liquibase.enabled=false
spring.liquibase.change-log=migrations/master.xml

# Resend API properties
app.resend.api-key=${RESEND_API_KEY}
app.resend.api-url=${RESEND_API_URL:https://api.resend.com/emails}
app.resend.from=${MAIL_FROM:TravelFellows <onboarding@resend.dev>}

# Path for saving images
app.upload.path=${UPLOAD_PATH:/app/uploads/}

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2000ms

# Cache Configuration
spring.cache.type=redis
spring.cache.redis.time-to-live=${CACHE_TTL:10m}
spring.cache.redis.cache-null-values=false
spring.cache.redis.key-prefix=travel-fellows::
spring.cache.redis.use-key-prefix=true

# OpenAPI/Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
