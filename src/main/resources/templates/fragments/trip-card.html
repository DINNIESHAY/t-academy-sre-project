<template id="tripCardTemplate" th:fragment="trip-card">
    <article class="trip-card">
        <div class="trip-info-block">
            <div class="trip-header">
                <div class="route-info">
                    <span class="departure"></span> <span class="route-arrow">→</span> <span class="destination"></span>
                </div>
                <div class="header-right">
                    <div class="budget-badge"></div>

                    <button class="apply-btn" aria-label="Подать заявку" title="Подать заявку">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="send-icon" style="width:18px; height:18px;">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                    </button>

                    <button class="favorite-btn" aria-label="В избранное">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="heart-icon">
                            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="trip-details">
                <div class="owner-info">👤 <span></span></div>
                <div class="detail-item date-range">📅 <span></span></div>
                <div class="slots-info">Количество мест: <span></span></div>
                <div class="tags-list"></div>
            </div>
        </div>
    </article>
</template>
